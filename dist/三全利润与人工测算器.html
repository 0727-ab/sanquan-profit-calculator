<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三全利润与人工测算器</title>
<style>
:root{
  --bg:#f4f4f2; --card:#ffffff; --line:#e3e2de; --line2:#d3d2cc;
  --t1:#1b1b1a; --t2:#52514e; --t3:#8a8984;
  --base:#2a78d6; --promo:#eb6834; --up:#1baf7a; --dec:#b9b8b1; --neg:#e34948;
  --input:#fffaf0; --focus:#2a78d6;
  --good:#0f7b45; --warn:#a15c00; --bad:#c22f2e; --info:#1c5cab;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.5 "Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
header .meta{display:flex;gap:8px;color:var(--t2);font-size:13px}
header .meta input{border:1px solid transparent;background:transparent;padding:2px 6px;border-radius:6px;width:120px}
header .meta input:hover,header .meta input:focus{border-color:var(--line2);background:#fff;outline:none}
header .grow{flex:1}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f6f6f4}
.btn.primary{background:var(--base);border-color:var(--base);color:#fff;font-weight:600}
.btn.primary:hover{background:#256abf}
.btn:disabled{opacity:.45;cursor:default}
.btn.on:disabled{opacity:1;border-color:var(--base);color:var(--base);background:#eef4fc;font-weight:600}
.btn.small{padding:3px 9px;font-size:12.5px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--t2)}
.btn.ghost:hover{background:#efefec}
nav.tabs{display:flex;gap:4px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line)}
nav.tabs button{border:none;background:none;padding:10px 14px;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;font-weight:600}
nav.tabs button.on{color:var(--t1);border-bottom-color:var(--base)}
main{padding:16px 20px 40px;max-width:1440px;margin:0 auto}
.page{display:none}.page.on{display:block}
.skus{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer}
.chip.on{background:var(--t1);color:#fff;border-color:var(--t1)}
.layout{display:grid;grid-template-columns:minmax(380px,460px) 1fr;gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sub{font-weight:400;color:var(--t3);font-size:12.5px}
.hint{color:var(--t3);font-size:12.5px}
table.inp{width:100%;border-collapse:collapse}
table.inp th{font-size:12.5px;color:var(--t2);font-weight:600;text-align:left;padding:4px 4px 6px;border-bottom:1px solid var(--line)}
table.inp th.b{color:var(--base)} table.inp th.p{color:var(--promo)}
table.inp td{padding:4px;vertical-align:middle;border-bottom:1px solid #f0efec}
table.inp td.lab{color:var(--t2);white-space:nowrap;font-size:13.5px}
table.inp td.lab small{color:var(--t3)}
.num{width:100%;border:1px solid var(--line2);background:var(--input);border-radius:6px;padding:5px 7px;text-align:right;font-variant-numeric:tabular-nums}
.num:focus,.txt:focus,select:focus{outline:2px solid var(--focus);outline-offset:-1px;background:#fff}
.num.miss{border-color:var(--neg);background:#fff3f3}
.num.ro{background:#f3f3f1;color:var(--t2)}
.txt{width:100%;border:1px solid var(--line2);background:#fff;border-radius:6px;padding:5px 7px}
select{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:4px 6px}
.est{font-size:11.5px;color:var(--t3);display:inline-flex;align-items:center;gap:2px;cursor:pointer;user-select:none}
.est input{margin:0}
.unitsel{display:flex;gap:4px;align-items:center}
.unitsel select{padding:2px 4px;font-size:12.5px}
details.adv{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.adv summary{cursor:pointer;font-weight:600;color:var(--t2);list-style:none}
details.adv summary::before{content:"▸ ";color:var(--t3)} details.adv[open] summary::before{content:"▾ "}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fcfcfb}
.item .row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.item .row3{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;margin-bottom:6px}
.item label{font-size:12px;color:var(--t3);display:block}
.item .err{color:var(--bad);font-size:12px}
.vars{font-size:12px;color:var(--t3);line-height:1.7}
.vars code{background:#efefec;border-radius:4px;padding:0 4px;color:var(--t2);cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:12.5px;color:var(--t2)}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v2{font-size:12.5px;color:var(--t2);font-variant-numeric:tabular-nums}
.kpi .v2 b{font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.headline{font-size:16px;font-weight:700;margin:14px 0 4px;padding:10px 12px;border-radius:10px;background:#eef4fc;border-left:4px solid var(--base)}
.headline.good{background:#eaf6ef;border-color:var(--good)} .headline.bad{background:#fdeeee;border-color:var(--bad)}
.notes{list-style:none;padding:0;margin:8px 0 0}
.notes li{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.notes li:last-child{border-bottom:none}
.tag{flex:none;font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px;height:20px;line-height:18px}
.tag.good{color:var(--good);background:#e3f3ea}.tag.warn{color:var(--warn);background:#fbf0dc}.tag.bad{color:var(--bad);background:#fbe5e5}.tag.info{color:var(--info);background:#e6eef9}
.charts{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:14px}
.chart-title{font-size:13.5px;font-weight:700;margin:0 0 2px}
.chart-sub{font-size:12px;color:var(--t3);margin-bottom:4px}
svg text{font-family:inherit}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:3px 10px;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--t1);color:#fff}
.legend{display:flex;gap:14px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
table.trace{width:100%;border-collapse:collapse;font-size:13px}
table.trace td,table.trace th{padding:5px 6px;border-bottom:1px solid #efeeea;text-align:right;font-variant-numeric:tabular-nums}
table.trace td:first-child,table.trace th:first-child{text-align:left}
table.trace td.f{text-align:left;color:var(--t3);font-size:12px}
table.trace tr.key td{font-weight:700}
#tip{position:fixed;pointer-events:none;background:#1b1b1a;color:#fff;font-size:12.5px;padding:6px 9px;border-radius:6px;z-index:50;display:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.preset{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.preset .btn.on{border-color:var(--base);color:var(--base);font-weight:600;background:#eef4fc}
table.edit{width:100%;border-collapse:collapse}
table.edit th{font-size:12px;color:var(--t2);text-align:left;font-weight:600;padding:4px;border-bottom:1px solid var(--line)}
table.edit td{padding:3px 4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1b1b1a;color:#fff;padding:8px 16px;border-radius:8px;display:none;z-index:60}
.setrow{display:grid;grid-template-columns:260px 120px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #f0efec}
.foot{color:var(--t3);font-size:12px;margin-top:20px;text-align:center}

.drop{border:2px dashed var(--line2);border-radius:14px;padding:36px;text-align:center;background:#fff;cursor:pointer;transition:.15s}
.drop.over,.drop:hover{border-color:var(--base);background:#f3f8fe}
.drop b{font-size:16px}
.chk{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin-top:6px}
.ok{color:var(--good)} .warnc{color:var(--warn)} .badc{color:var(--bad)}
.ctrl{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ctrl label{font-size:13px;color:var(--t2);display:flex;gap:6px;align-items:center}
.custs{display:flex;gap:6px;flex-wrap:wrap}
.custs label{border:1px solid var(--line2);border-radius:999px;padding:3px 10px;cursor:pointer;background:#fff;font-size:13px}
.custs label.on{background:var(--t1);color:#fff;border-color:var(--t1)}
.custs input{display:none}
.rv2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rvcol h3{font-size:14px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-h{font-size:13px;font-weight:700;margin:14px 0 4px;color:var(--t1)}
table.fee{width:100%;border-collapse:collapse;font-size:13px}
table.fee td,table.fee th{padding:4px 6px;border-bottom:1px solid #efeeea;text-align:right;font-variant-numeric:tabular-nums}
table.fee td:first-child,table.fee th:first-child{text-align:left}
table.fee tr.dr td{color:var(--t3);font-size:12px;border-bottom:none;padding-top:0}
.up{color:var(--good)} .dn{color:var(--bad)}
textarea.concl{width:100%;min-height:78px;border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;resize:vertical;background:#fffef8}
.skuline{font-size:12.5px;color:var(--t2);line-height:1.7}
.gen{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f6f6f4;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
@media (max-width:1100px){.rv2,.mini{grid-template-columns:1fr}.layout,.charts,.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>三全利润与人工测算器</h1>
  <div class="meta">
    <input id="m-company" title="公司">
    <input id="m-channel" title="渠道">
    <input id="m-month" title="月份" style="width:90px">
  </div>
  <div class="grow"></div>
  <button class="btn ghost" id="b-reset" title="清空当前内容，恢复演示数据">恢复演示数据</button>
  <button class="btn" id="b-open">打开方案</button>
  <button class="btn" id="b-save">保存方案</button>
  <button class="btn primary" id="b-xlsx">导出 Excel</button>
  <input type="file" id="f-open" accept=".json" hidden>
</header>
<nav class="tabs">
  <button data-tab="profit" class="on">利润测算</button>
  <button data-tab="review">数据复盘</button>
  <button data-tab="labor">人工成本</button>
  <button data-tab="sum">SKU 汇总</button>
  <button data-tab="set">设置与说明</button>
</nav>
<main>
  <!-- 利润测算 -->
  <section class="page on" id="p-profit">
    <div class="skus" id="sku-chips"></div>
    <div class="layout">
      <div class="card" id="inputs"></div>
      <div>
        <div class="card" id="results"></div>
        <div class="card" style="margin-top:16px" id="advanced"></div>
      </div>
    </div>
  </section>
  <!-- 数据复盘 -->
  <section class="page" id="p-review"><div id="review"></div></section>
  <!-- 人工 -->
  <section class="page" id="p-labor">
    <div class="grid2">
      <div class="card" id="labor-in"></div>
      <div class="card" id="labor-out"></div>
    </div>
  </section>
  <!-- 汇总 -->
  <section class="page" id="p-sum"><div class="card" id="sum"></div></section>
  <!-- 设置 -->
  <section class="page" id="p-set"><div class="card" id="set"></div></section>
  <div class="foot">演示数据全部为假设 · 数据只保存在这台电脑的浏览器里，换电脑请用“保存方案 / 打开方案” · V2</div>
</main>
<div id="tip"></div>
<div class="toast" id="toast"></div>

<script>/* ===== 演示数据（全部为假设） ===== */
const LABOR_PRESETS = {
  A: { label: 'A 固定薪资型', roles: [{ name: '仓管', count: 1, salary: 4500, social: 30, perfBase: 0, perfCoef: 0 }, { name: '行政', count: 1, salary: 4000, social: 30, perfBase: 0, perfCoef: 0 }], piece: 0, revPct: 0, tiers: [] },
  B: { label: 'B 底薪 + 计件型', roles: [{ name: '拣货员', count: 2, salary: 3500, social: 30, perfBase: 0, perfCoef: 0 }], piece: 0.1, revPct: 0, tiers: [] },
  C: { label: 'C 绩效激励型', roles: [{ name: '业务员', count: 2, salary: 4000, social: 30, perfBase: 800, perfCoef: 1 }], piece: 0.1, revPct: 0, tiers: [{ threshold: 1200, amount: 600 }] }
};
function scheme(o) { return Object.assign({ list: 18, discount: 0, volume: 1000, purchase: 10, purchaseUnit: 'bag', bagsPerBox: 12, laborMode: 'manual', labor: 0.4, cold: 1, loss: 0.2, rate: 5, rateBase: 'eff', fee: 2000 }, o); }
function defaultState() {
  return {
    version: 1,
    meta: { company: '三全郑州分公司', channel: '演示渠道', month: '2026-12' },
    skus: [
      { id: 's1', name: '速冻水饺 500g', base: scheme({}), promo: scheme({ discount: 2, volume: 1200 }), items: [], metrics: [], laborAlloc: 10, assumed: { purchase: true, labor: true, cold: true, loss: true } },
      { id: 's2', name: '汤圆 400g', base: scheme({ list: 12, purchase: 6.5, labor: 0.3, cold: 0.8, loss: 0.15, fee: 1000, volume: 1500 }), promo: scheme({ list: 12, discount: 1.5, purchase: 6.5, labor: 0.3, cold: 0.8, loss: 0.15, fee: 1000, volume: 1900 }), items: [], metrics: [], laborAlloc: 10, assumed: { purchase: true, labor: true, cold: true, loss: true } },
      { id: 's3', name: '馄饨 300g', base: scheme({ list: 15, purchase: 8.8, labor: 0.35, cold: 0.9, loss: 0.25, fee: 1500, volume: 800 }), promo: scheme({ list: 15, discount: 2, purchase: 8.8, labor: 0.35, cold: 0.9, loss: 0.25, fee: 1500, volume: 1050 }), items: [], metrics: [], laborAlloc: 10, assumed: { purchase: true, labor: true, cold: true, loss: true } }
    ],
    active: 0,
    view: 'promo',
    labor: Object.assign({ preset: 'C', alloc: 10 }, JSON.parse(JSON.stringify(LABOR_PRESETS.C))),
    settings: { targetMargin: 15, coldMax: 5, laborMax: 8, liftMax: 30, assumedMax: 50 },
    commonFee: 0
  };
}
if (typeof module !== 'undefined') module.exports = { defaultState, LABOR_PRESETS, scheme };
</script>
<script>/* ===== 计算引擎：利润 / 人工 / 公式 ===== */
const Engine = (() => {
  const EPS = 1e-9;
  const ceil = x => Math.ceil(x - EPS);
  const num = v => (v === '' || v === null || v === undefined || isNaN(+v)) ? NaN : +v;

  /* ---------- 公式解析（四则运算、比较、IF/MIN/MAX/ROUND） ---------- */
  const FUNCS = { IF: 3, MIN: -1, MAX: -1, ROUND: 2 };
  function tokenize(src) {
    const t = []; let i = 0; const s = String(src).replace(/^\s*=/, '');
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; t.push({ k: 'n', v: parseFloat(s.slice(i, j)) }); i = j; continue; }
      if (/[A-Za-z_一-鿿]/.test(c)) { let j = i; while (j < s.length && /[A-Za-z0-9_一-鿿]/.test(s[j])) j++; t.push({ k: 'id', v: s.slice(i, j) }); i = j; continue; }
      const two = s.slice(i, i + 2);
      if (['>=', '<=', '<>'].includes(two)) { t.push({ k: 'op', v: two }); i += 2; continue; }
      if ('+-*/(),><=×÷（），'.includes(c)) {
        const map = { '×': '*', '÷': '/', '（': '(', '）': ')', '，': ',' };
        t.push({ k: 'op', v: map[c] || c }); i++; continue;
      }
      throw new Error('公式里有无法识别的字符：' + c);
    }
    return t;
  }
  function parse(src) {
    const t = tokenize(src); let p = 0;
    const peek = () => t[p], eat = v => { if (!t[p] || t[p].v !== v) throw new Error('公式缺少 “' + v + '”'); p++; };
    function cmp() { let a = add(); while (peek() && ['>', '<', '>=', '<=', '=', '<>'].includes(peek().v)) { const o = t[p++].v; a = { k: 'bin', o, a, b: add() }; } return a; }
    function add() { let a = mul(); while (peek() && ['+', '-'].includes(peek().v)) { const o = t[p++].v; a = { k: 'bin', o, a, b: mul() }; } return a; }
    function mul() { let a = un(); while (peek() && ['*', '/'].includes(peek().v)) { const o = t[p++].v; a = { k: 'bin', o, a, b: un() }; } return a; }
    function un() { if (peek() && peek().v === '-') { p++; return { k: 'neg', a: un() }; } if (peek() && peek().v === '+') { p++; return un(); } return atom(); }
    function atom() {
      const x = t[p++]; if (!x) throw new Error('公式不完整');
      if (x.k === 'n') return { k: 'n', v: x.v };
      if (x.v === '(') { const e = cmp(); eat(')'); return e; }
      if (x.k === 'id') {
        const F = x.v.toUpperCase();
        if (peek() && peek().v === '(' && F in FUNCS) {
          p++; const args = [];
          if (peek() && peek().v !== ')') { args.push(cmp()); while (peek() && peek().v === ',') { p++; args.push(cmp()); } }
          eat(')');
          if (FUNCS[F] > 0 && args.length !== FUNCS[F]) throw new Error(F + ' 需要 ' + FUNCS[F] + ' 个参数');
          if (!args.length) throw new Error(F + ' 缺少参数');
          return { k: 'fn', f: F, args };
        }
        return { k: 'var', v: x.v };
      }
      throw new Error('公式在 “' + x.v + '” 附近有误');
    }
    const e = cmp(); if (p < t.length) throw new Error('公式在 “' + t[p].v + '” 附近有误'); return e;
  }
  function vars(ast, out = new Set()) {
    if (!ast) return out;
    if (ast.k === 'var') out.add(ast.v);
    ['a', 'b'].forEach(k => ast[k] && vars(ast[k], out));
    (ast.args || []).forEach(a => vars(a, out));
    return out;
  }
  function evalAst(ast, env) {
    switch (ast.k) {
      case 'n': return ast.v;
      case 'var': if (!(ast.v in env)) throw new Error('找不到变量 “' + ast.v + '”'); return env[ast.v];
      case 'neg': return -evalAst(ast.a, env);
      case 'bin': {
        const a = evalAst(ast.a, env), b = evalAst(ast.b, env);
        switch (ast.o) {
          case '+': return a + b; case '-': return a - b; case '*': return a * b;
          case '/': if (b === 0) throw new Error('公式里出现除以 0'); return a / b;
          case '>': return a > b ? 1 : 0; case '<': return a < b ? 1 : 0; case '>=': return a >= b ? 1 : 0;
          case '<=': return a <= b ? 1 : 0; case '=': return Math.abs(a - b) < EPS ? 1 : 0; case '<>': return Math.abs(a - b) >= EPS ? 1 : 0;
        }
      }
      case 'fn': {
        const v = ast.args.map(a => evalAst(a, env));
        if (ast.f === 'IF') return v[0] ? v[1] : v[2];
        if (ast.f === 'MIN') return Math.min(...v);
        if (ast.f === 'MAX') return Math.max(...v);
        if (ast.f === 'ROUND') { const m = Math.pow(10, v[1]); return Math.round(v[0] * m) / m; }
      }
    }
    throw new Error('公式无法计算');
  }
  function toExcel(ast, ref) {
    const r = a => toExcel(a, ref);
    switch (ast.k) {
      case 'n': return String(ast.v);
      case 'var': if (!(ast.v in ref)) throw new Error('导出时找不到变量 ' + ast.v); return ref[ast.v];
      case 'neg': return '(-' + r(ast.a) + ')';
      case 'bin': return '(' + r(ast.a) + ast.o + r(ast.b) + ')';
      case 'fn': return ast.f + '(' + ast.args.map(r).join(',') + ')';
    }
  }
  function evalFormula(src, env) { return evalAst(parse(src), env); }

  /* ---------- 人工计算器 ---------- */
  function sortedTiers(L) {
    return (L.tiers || []).filter(t => num(t.threshold) > 0 && num(t.amount) > 0)
      .map(t => ({ threshold: +t.threshold, amount: +t.amount })).sort((a, b) => a.threshold - b.threshold);
  }

  /* ---------- 单个方案 ---------- */

  const CORE_NAME = { list: '标价', discount: '商家折扣', volume: '销量', purchase: '采购', labor: '人工', cold: '冷链', loss: '损耗', rate: '扣点率', fee: '活动费' };

  function compute(sku, key, labor, overrides) {

    else out.push({ level: 'info', text: '促销预计卖 ' + p.V.toLocaleString() + ' 袋，距离追平基准利润还差 ' + (eq - p.V).toLocaleString() + ' 袋（需 ' + eq.toLocaleString() + ' 袋）。' });

    });

    sheets.forEach((s, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: s.xml() }));
    return zip(files);
  }

  /* ---------- 由计算器状态生成工作簿 ---------- */
  const sheetName = (n, used) => { let s = String(n || 'SKU').replace(/[\[\]:*?\/\\']/g, '').slice(0, 28) || 'SKU'; let x = s, i = 2; while (used.has(x)) x = s + i++; used.add(x); return x; };
  const q = n => `'${n}'`;

  function laborSheet(L, E) {
    const sh = new Sheet('人工'); sh.widths = [22, 10, 12, 14, 12, 12, 16];
    sh.set(0, 1, { v: '人工成本计算（黄色格可修改）', s: S.title });
    ['岗位', '人数', '月薪', '社保公积金比例', '绩效基数', '绩效系数', '月人工合计'].forEach((h, c) => sh.set(c, 2, { v: h, s: S.head }));
    const roles = L.roles || []; let r = 3;
    const team = E.laborTeam(L);
    roles.forEach((ro, i) => {
      sh.set(0, r, { v: ro.name || '岗位' + (i + 1), s: S.inTxt }); sh.set(1, r, { v: +ro.count || 0, s: S.inInt }); sh.set(2, r, { v: +ro.salary || 0, s: S.inMoney });
      sh.set(3, r, { v: (+ro.social || 0) / 100, s: S.inPct }); sh.set(4, r, { v: +ro.perfBase || 0, s: S.inMoney }); sh.set(5, r, { v: +ro.perfCoef || 0, s: S.inTxt });
      sh.set(6, r, { f: `B${r}*(C${r}*(1+D${r})+E${r}*F${r})`, v: team.roles[i].total, s: S.money }); r++;
    });
    const first = 3, last = Math.max(3, r - 1); if (!roles.length) r = 4;
    const ref = {};
    const row = (label, cell, key) => { sh.set(0, r, { v: label, s: S.txt }); sh.set(1, r, cell); ref[key] = `${q('人工')}!$B$${r}`; r++; };
    r++;
    row('团队月人工合计', { f: roles.length ? `SUM(G${first}:G${last})` : '0', v: team.team, s: S.money }, 'team');
    row('每袋提成（元/袋）', { v: +L.piece || 0, s: S.inMoney }, 'piece');
    row('收入提成比例', { v: (+L.revPct || 0) / 100, s: S.inPct }, 'revPct');
    r++;
    sh.set(0, r, { v: '阶梯激励（门槛需从小到大）', s: S.sec }); sh.set(1, r, { v: '销量门槛', s: S.sec }); sh.set(2, r, { v: '奖励金额', s: S.sec }); r++;
    const tiers = E.sortedTiers(L); ref.tiers = [];
    tiers.forEach((t, i) => { sh.set(0, r, { v: '第' + (i + 1) + '档', s: S.txt }); sh.set(1, r, { v: t.threshold, s: S.inInt }); sh.set(2, r, { v: t.amount, s: S.inMoney }); ref.tiers.push({ t: `${q('人工')}!$B$${r}`, a: `${q('人工')}!$C$${r}`, tv: t.threshold, av: t.amount }); r++; });
    r++; sh.set(0, r, { v: '说明：团队月人工 × 各 SKU 表里的“人工归属比例” = 计入该 SKU 固定费用的人工；提成按袋计入单位成本；达到门槛时发放对应档位的奖励（取达到的最高一档）。', s: S.note });
    return { sh, ref };
  }

  function skuSheet(name, sku, state, E, lref) {
    const sh = new Sheet(name); sh.widths = [30, 16, 16, 46];
    const L = state.labor, R = { base: E.compute(sku, 'base', L), promo: E.compute(sku, 'promo', L) };
    const keys = ['base', 'promo'], col = { base: 1, promo: 2 }, CL = { base: 'B', promo: 'C' };
    sh.set(0, 1, { v: (sku.name || 'SKU') + ' 利润测算（黄色格可修改，其余为公式）', s: S.title });
    ['项目', '基准方案', '促销方案', '说明'].forEach((h, c) => sh.set(c, 2, { v: h, s: S.head }));
    let r = 3; const row = {};
    const line = (key, label, note, fn) => { row[key] = r; sh.set(0, r, { v: label }); if (note) sh.set(3, r, { v: note, s: S.note }); keys.forEach(k => { const c = fn(k, CL[k], r); if (c) sh.set(col[k], r, c); }); r++; };
    const sec = label => { sh.set(0, r, { v: label, s: S.sec }); [1, 2, 3].forEach(c => sh.set(c, r, { v: '', s: S.sec })); r++; };
    sec('输入参数');
    line('list', '标价（元/袋）', '扣渠道费前的单袋售价', k => ({ v: +sku[k].list, s: S.inMoney }));
    line('disc', '商家承担折扣（元/袋）', '直接录折后价时填 0', k => ({ v: +(sku[k].discount || 0), s: S.inMoney }));
    line('vol', '预计销量（袋）', '', k => ({ v: +sku[k].volume, s: S.inInt }));
    line('pur', '采购价', '按箱录入时为元/箱，按袋录入时为元/袋', k => ({ v: +sku[k].purchase, s: S.inMoney }));
    line('box', '每箱袋数（按袋录入填 1）', '', k => ({ v: sku[k].purchaseUnit === 'box' ? +sku[k].bagsPerBox : 1, s: S.inInt }));
    // 有效售价行号先占位，后面回填公式引用
    const effRow = () => row.eff;
    line('labor', '人工（元/袋）', '来自人工表时为公式；不计人工时为 0', (k, C) => sku[k].laborMode === 'calc' ? { f: `${lref.piece}+${lref.revPct}*${C}{EFF}`, v: R[k].laborBag, s: S.money } : sku[k].laborMode === 'none' ? { v: 0, s: S.money } : { v: +sku[k].labor, s: S.inMoney });
    line('alloc', '人工归属比例', '团队月人工中算到本 SKU 的比例（用人工表时生效）', () => ({ v: (sku.laborAlloc === undefined || sku.laborAlloc === '' ? (+L.alloc || 0) : +sku.laborAlloc) / 100, s: S.inPct }));
    line('cold', '冷链（元/袋）', '', k => ({ v: +sku[k].cold, s: S.inMoney }));
    line('loss', '损耗（元/袋）', '', k => ({ v: +sku[k].loss, s: S.inMoney }));
    line('rate', '渠道扣点率', '', k => ({ v: (+sku[k].rate) / 100, s: S.inPct }));
    line('rbase', '扣点基数', '填“有效售价”或“标价”，按合同', k => ({ v: sku[k].rateBase === 'list' ? '标价' : '有效售价', s: S.inTxt }));
    line('fee', '活动费（元）', '可归属本场景的一次性费用', k => ({ v: +(sku[k].fee || 0), s: S.inMoney }));
    // 自定义项目
    const items = sku.items || [], itemRow = {}, orderRow = {};
    const NAT = { cost: '成本', subsidy: '补贴', ref: '参考' }, MET = { bag: '按袋', order: '按单', pct: '按比例', event: '按活动' };
    if (items.length) sec('自定义项目');
    items.forEach((it, i) => {
      const ref0 = C => ({ 标价: C + row.list, 商家折扣: C + row.disc, 有效售价: C + '{EFF}', 销量: C + row.vol, 采购: C + '{PURBAG}', 人工: C + row.labor, 冷链: C + row.cold, 损耗: C + row.loss, 扣点率: C + row.rate, 活动费: C + row.fee });
      line('it' + i, (it.name || '自定义' + (i + 1)) + '（' + NAT[it.nature] + '·' + MET[it.method] + '）', it.src === 'formula' ? '公式：' + (it.vals.base || '') : (it.method === 'pct' ? '比例' : ''), (k, C) => {
        const res = R[k].items[i] || { value: 0 }, isPct = it.method === 'pct';
        const v = isPct ? res.value / 100 : res.value, st = isPct ? (it.src === 'formula' ? S.pct : S.inPct) : (it.src === 'formula' ? S.money : S.inMoney);
        if (it.src === 'formula') {
          const ref = ref0(C); items.slice(0, i).forEach((p, j) => { if (p.name) ref[p.name] = C + itemRow[j]; });
          let f; try { f = E.toExcel(E.parse(it.vals[k] || '0'), ref); } catch (e) { f = '0'; }
          return { f: isPct ? `(${f})/100` : f, v, s: st };
        }
        return { v, s: st };
      });
      itemRow[i] = row['it' + i];
      if (it.method === 'order') { line('io' + i, '  └ 每单袋数', '', () => ({ v: +it.bagsPerOrder || 0, s: S.inInt })); orderRow[i] = row['io' + i]; }
    });
    const calc = state.labor && keys.some(k => sku[k].laborMode === 'calc');
    line('lfix', '人工固定（元）', '团队月人工 × 人工归属比例', (k, C) => sku[k].laborMode === 'calc' ? { f: `${lref.team}*${C}${row.alloc}`, v: R[k].laborFixed, s: S.money } : { v: 0, s: S.money });
    line('tier', '阶梯激励（元）', '来自人工表：达到门槛的奖励', (k, C) => {
      if (sku[k].laborMode !== 'calc' || !lref.tiers.length) return { v: 0, s: S.money };
      let f = '0'; lref.tiers.forEach(t => { f = `IF(${C}${row.vol}>=${t.t},${t.a},${f})`; });
      return { f, v: R[k].tier, s: S.money };
    });
    sec('计算结果（公式，自动重算）');
    line('eff', '有效售价（元/袋）', '标价 − 商家承担折扣', (k, C) => ({ f: `${C}${row.list}-${C}${row.disc}`, v: R[k].eff, s: S.money }));
    line('purbag', '采购（元/袋）', '', (k, C) => ({ f: `${C}${row.pur}/${C}${row.box}`, v: R[k].purchase, s: S.money }));
    line('rev', '销售收入', '有效售价 × 销量', (k, C) => ({ f: `${C}${row.eff}*${C}${row.vol}`, v: R[k].rev, s: S.keyMoney }));
    line('comm', '渠道扣点（元/袋）', '', (k, C) => ({ f: `${C}${row.rate}*IF(${C}${row.rbase}="标价",${C}${row.list},${C}${row.eff})`, v: R[k].commission, s: S.money }));
    const per = (C, it, i) => it.method === 'bag' ? C + itemRow[i] : it.method === 'order' ? `${C}${itemRow[i]}/${C}${orderRow[i]}` : it.method === 'pct' ? `${C}${itemRow[i]}*${it.pctBase === 'list' ? C + row.list : C + row.eff}` : null;
    const sumOf = (C, nat, evt) => { const xs = items.map((it, i) => it.nature === nat ? (evt ? (it.method === 'event' ? C + itemRow[i] : null) : per(C, it, i)) : null).filter(Boolean); return xs.length ? xs.join('+') : '0'; };
    line('cbag', '其他每袋成本', '自定义成本（按袋/按单/按比例）', (k, C) => ({ f: sumOf(C, 'cost', false), v: R[k].costBag, s: S.money }));
    line('sbag', '每袋补贴', '自定义补贴（按袋/按单/按比例）', (k, C) => ({ f: sumOf(C, 'subsidy', false), v: R[k].subBag, s: S.money }));
    line('unit', '单位贡献（元/袋）', '有效售价 − 各项每袋成本 + 每袋补贴', (k, C) => ({ f: `${C}${row.eff}-${C}${row.purbag}-${C}${row.labor}-${C}${row.cold}-${C}${row.loss}-${C}${row.comm}-${C}${row.cbag}+${C}${row.sbag}`, v: R[k].unit, s: S.keyMoney }));
    line('contrib', '贡献利润', '单位贡献 × 销量', (k, C) => ({ f: `${C}${row.unit}*${C}${row.vol}`, v: R[k].contribution, s: S.money }));
    line('fixed', '固定费用', '活动费 + 人工固定 + 阶梯激励 + 按活动计的成本', (k, C) => ({ f: `${C}${row.fee}+${C}${row.lfix}+${C}${row.tier}+${sumOf(C, 'cost', true)}`, v: R[k].fixed, s: S.money }));
    line('sevt', '活动补贴', '按活动总额计的补贴', (k, C) => ({ f: sumOf(C, 'subsidy', true), v: R[k].subEvt, s: S.money }));
    line('profit', '预计场景利润', '贡献利润 − 固定费用 + 活动补贴', (k, C) => ({ f: `${C}${row.contrib}-${C}${row.fixed}+${C}${row.sevt}`, v: R[k].profit, s: S.keyMoney }));
    line('margin', '场景利润率', '', (k, C) => ({ f: `IF(${C}${row.rev}=0,"—",${C}${row.profit}/${C}${row.rev})`, v: R[k].margin === null ? '—' : R[k].margin, s: S.pct }));
    line('urate', '单位贡献率', '单位贡献 ÷ 有效售价', (k, C) => ({ f: `IF(${C}${row.eff}=0,"—",${C}${row.unit}/${C}${row.eff})`, v: R[k].unitRate === null ? '—' : R[k].unitRate, s: S.pct }));
    const mv = (k, C, T) => {
      const U = C + row.unit, F0 = `(${C}${row.fixed}-${C}${row.tier})`, Sb = C + row.sevt;
      const tiers = sku[k].laborMode === 'calc' ? lref.tiers : [];
      if (!tiers.length) return `IF(${U}<=0,"无可用",MAX(0,ROUNDUP((${T}+${F0}-${Sb})/${U},0)))`;
      const cand = (start, bonus) => `MAX(${start},ROUNDUP((${T}+${F0}+${bonus}-${Sb})/${U},0))`;
      const segs = [{ s: '0', b: '0' }].concat(tiers.map(t => ({ s: t.t, b: t.a })));
      let f = cand(segs[segs.length - 1].s, segs[segs.length - 1].b);
      for (let i = segs.length - 2; i >= 0; i--) f = `IF(${cand(segs[i].s, segs[i].b)}<${segs[i + 1].s},${cand(segs[i].s, segs[i].b)},${f})`;
      return `IF(${U}<=0,"无可用",${f})`;
    };
    line('be', '盈亏平衡销量（袋）', '利润 ≥ 0 的最低销量', (k, C) => ({ f: mv(k, C, '0'), v: R[k].be === null ? '无可用' : R[k].be, s: S.keyInt }));
    const eq = R.promo.minVolume(R.base.profit);
    line('eq', '追平基准利润所需销量（袋）', '促销方案达到基准方案利润的最低销量', (k, C) => k === 'promo' ? { f: mv(k, C, `B${row.profit}`), v: eq === null ? '无可用' : eq, s: S.keyInt } : { v: '—' });
    line('gap', '距离追平还差（袋）', '负数表示已超过', (k, C) => k === 'promo' ? { f: `IF(ISNUMBER(C${row.eq}),C${row.eq}-C${row.vol},"—")`, v: eq === null ? '—' : eq - R.promo.V, s: S.int } : { v: '—' });
    // 衍生指标
    const ms = sku.metrics || [];
    if (ms.length) {
      sec('自定义指标');
      ms.forEach((m, i) => line('m' + i, m.name || '指标' + (i + 1), '公式：' + m.expr, (k, C) => {
        const ref = { 标价: C + row.list, 商家折扣: C + row.disc, 有效售价: C + row.eff, 销量: C + row.vol, 采购: C + row.purbag, 人工: C + row.labor, 冷链: C + row.cold, 损耗: C + row.loss, 扣点率: C + row.rate, 活动费: C + row.fee, 收入: C + row.rev, 单位贡献: C + row.unit, 贡献利润: C + row.contrib, 固定费用: C + row.fixed, 场景利润: C + row.profit, 利润率: `IF(ISNUMBER(${C}${row.margin}),${C}${row.margin},0)`, 单位贡献率: `IF(ISNUMBER(${C}${row.urate}),${C}${row.urate},0)` };
        items.forEach((p, j) => { if (p.name) ref[p.name] = C + itemRow[j]; });
        ms.slice(0, i).forEach((p, j) => { if (p.name) ref[p.name] = C + row['m' + j]; });
        const mres = R[k].metrics[i] || {};
        try { return { f: E.toExcel(E.parse(m.expr), ref), v: mres.value, s: S.txt }; } catch (e) { return { v: '公式有误' }; }
      }));
    }
    // 回填占位
    Object.values(sh.rows).forEach(rw => Object.values(rw).forEach(c => { if (c.f) c.f = c.f.replace(/\{EFF\}/g, row.eff).replace(/\{PURBAG\}/g, row.purbag); }));
    return { sh, row, R };
  }

  function build(state, E, analyses) {
    const used = new Set(['说明', '汇总', '人工', '分析提示']);
    const lab = laborSheet(state.labor, E);
    const skus = state.skus.map(s => ({ s, name: sheetName(s.name, used) }));
    const sheets = skus.map(x => Object.assign(skuSheet(x.name, x.s, state, E, lab.ref), { name: x.name }));
    // 汇总
    const sum = new Sheet('汇总'); sum.widths = [24, 16, 16, 16, 16];
    sum.set(0, 1, { v: '各 SKU 汇总（同一渠道、同一月份）', s: S.title });
    ['SKU', '基准收入', '基准利润', '促销收入', '促销利润'].forEach((h, c) => sum.set(c, 2, { v: h, s: S.head }));
    let r = 3;
    sheets.forEach(x => {
      const n = q(x.name); sum.set(0, r, { v: x.name });
      sum.set(1, r, { f: `${n}!B${x.row.rev}`, v: x.R.base.rev, s: S.money }); sum.set(2, r, { f: `${n}!B${x.row.profit}`, v: x.R.base.profit, s: S.money });
      sum.set(3, r, { f: `${n}!C${x.row.rev}`, v: x.R.promo.rev, s: S.money }); sum.set(4, r, { f: `${n}!C${x.row.profit}`, v: x.R.promo.profit, s: S.money }); r++;
    });
    const f1 = 3, l1 = r - 1, tot = k => sheets.reduce((a, x) => a + x.R[k.split('.')[0]][k.split('.')[1]], 0);
    sum.set(0, r, { v: '各 SKU 合计', s: S.sec }); ['B', 'C', 'D', 'E'].forEach((c, i) => sum.set(i + 1, r, { f: `SUM(${c}${f1}:${c}${l1})`, v: tot(['base.rev', 'base.profit', 'promo.rev', 'promo.profit'][i]), s: S.keyMoney })); const tr = r; r++;
    sum.set(0, r, { v: '共同费用（只登记一次）' }); sum.set(2, r, { v: +state.commonFee || 0, s: S.inMoney }); sum.set(4, r, { v: +state.commonFee || 0, s: S.inMoney }); const cr = r; r++;
    sum.set(0, r, { v: '汇总利润' }); sum.set(2, r, { f: `C${tr}-C${cr}`, v: tot('base.profit') - (+state.commonFee || 0), s: S.keyMoney }); sum.set(4, r, { f: `E${tr}-E${cr}`, v: tot('promo.profit') - (+state.commonFee || 0), s: S.keyMoney }); const pr = r; r++;
    sum.set(0, r, { v: '汇总利润率' });
    const bm = tot('base.rev') ? (tot('base.profit') - (+state.commonFee || 0)) / tot('base.rev') : '—', pm = tot('promo.rev') ? (tot('promo.profit') - (+state.commonFee || 0)) / tot('promo.rev') : '—';
    sum.set(2, r, { f: `IF(B${tr}=0,"—",C${pr}/B${tr})`, v: bm, s: S.pct }); sum.set(4, r, { f: `IF(D${tr}=0,"—",E${pr}/D${tr})`, v: pm, s: S.pct }); r += 2;
    sum.set(0, r, { v: '盈亏平衡销量不跨 SKU 相加；共同费用不分摊到单个 SKU。', s: S.note });
    // 分析提示
    const an = new Sheet('分析提示'); an.widths = [18, 100];
    an.set(0, 1, { v: '导出时的分析提示（文字不会随 Excel 修改自动更新）', s: S.title });
    ['SKU', '提示'].forEach((h, c) => an.set(c, 2, { v: h, s: S.head })); r = 3;
    skus.forEach((x, i) => (analyses[i] || []).forEach(a => { an.set(0, r, { v: x.name }); an.set(1, r, { v: a.text }); r++; }));
    // 说明
    const doc = new Sheet('说明'); doc.widths = [110];
    ['三全食品 利润与人工成本测算（由网页计算器导出）', '', '· 黄色格子是输入，可以直接修改；其余格子是公式，会自动重算。',
      '· 每个 SKU 一张表：上半部分是参数，下半部分是计算结果。“汇总”表合计各 SKU；“人工”表是人工成本计算器。',
      '· 盈亏平衡销量和追平销量已考虑阶梯激励。阶梯门槛请保持从小到大。', '· “分析提示”是导出那一刻的文字结论，修改数字后请回到网页重新生成。',

<script>/* ===== Excel 读取：在浏览器本地解析 .xlsx（不上传、不联网、无第三方库） ===== */
const XLSXRead = (() => {
  const td = new TextDecoder('utf-8');

    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(buf);
  }

    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }

  async function open(arrayBuffer) {

    const rels = await z.get('xl/_rels/workbook.xml.rels') || '';

    rels.replace(/<Relationship[^>]*?Target="([^"]+)"[^>]*?Id="([^"]+)"/g, (m, tg, id) => { relMap[id] = relMap[id] || tg; });

})();

<script>/* ===== 损益复盘引擎：读系统导出的“本期 / 同期”明细，生成当月 / 累计对比分析 ===== */
const Review = (() => {
  // 字段清单：必需字段缺一个就拒绝导入；可选字段缺了，对应分析隐藏，绝不当 0 计算
  const NEED = ['日历年/月', '收入', '=产品考核净利润'];
  const OPTIONAL = [['-产品成本', '产品成本'], ['=产品毛利额', '毛利额（毛利率）'], ['-AP', 'AP 费用'], ['-TP', 'TP 费用'], ['-CP', 'CP 费用'], ['-PP', 'PP 费用'], ['-MP', 'MP 费用'], ['-FP', 'FP 费用'],
    ['一级品类', '一级品类（产品维度）'], ['四级规格', '四级规格（规格明细）'], ['-产品组/研发费用合计', '产品组/研发费用'], ['-AE', '公摊费用 AE'], ['所得税', '所得税']];
  const FEES = ['-AP', '-TP', '-CP', '-PP', '-MP', '-FP'];
  const DIMS = ['四级渠道', '三级渠道', '二级渠道', '一级渠道', '考核组织名称', '战区', '大区'];
  // 数据类型模板：每种报表一条，写明需要哪几张表、表头特征。以后新增类型在这里加一条即可。
  const SOURCES = [
    { id: 'pl-yoy', name: '系统损益明细（本期 / 同期）', sheets: ['本期', '同期'], headerHas: ['日历年/月', '收入', '=产品考核净利润'],
      desc: '从系统导出的损益明细，每行是“月份 × 客户 × 规格”，含收入、成本和各项费用；用于当月 / 累计同比复盘。' }
  ];
  function detect(sheetNames) {
    for (const src of SOURCES) { const got = src.sheets.map(n => sheetNames.find(x => x.trim() === n)); if (got.every(Boolean)) return { src, sheets: got }; }
    return null;
  }

  /* ---------- 数据集 ---------- */
  function dataset(rows, label) {
    const hi = rows.findIndex(r => r && r.includes('日历年/月') && r.includes('收入'));
    if (hi < 0) throw new Error(`“${label}”表里找不到表头（需要有“日历年/月”和“收入”两列）`);
    const hdr = rows[hi].map(x => x == null ? '' : String(x).trim()), col = {};
    hdr.forEach((h, i) => { if (h && !(h in col)) col[h] = i; });
    const miss = NEED.filter(n => !(n in col));
    if (miss.length) throw new Error(`“${label}”表缺少必需的列：${miss.join('、')}。请确认导出的是系统损益明细。`);
    if (!DIMS.some(d => d in col)) throw new Error(`“${label}”表里没有可以区分客户的列（${DIMS.join(' / ')}）`);
    const iMonth = col['日历年/月'];
    const data = rows.slice(hi + 1).filter(r => r && r[iMonth] != null && String(r[iMonth]).trim() !== '').map(r => { r[iMonth] = normMonth(r[iMonth]); return r; });
    // 每项费用的子项：从该费用列到下一个“-”或“=”开头的列之间
    const groups = {};
    FEES.forEach(f => {
      if (!(f in col)) { groups[f] = []; return; }
      const s = col[f]; let e = s + 1; while (e < hdr.length && !/^[-=]/.test(hdr[e]) && !DIMS.includes(hdr[e])) e++;
      const sub = [];
      for (let i = s + 1; i < e; i++) { if (/^\d+-/.test(hdr[i])) sub.push({ i, name: hdr[i], level: 1 }); else if (/^\d+\.\d+-/.test(hdr[i])) sub.push({ i, name: hdr[i], level: 2 }); }
      groups[f] = sub;
    });
    const numCols = []; for (let i = col['收入']; i <= col['=产品考核净利润']; i++) numCols.push(i);
    const months = [...new Set(data.map(r => r[iMonth]))].sort();
    const dims = DIMS.filter(d => d in col);
    const has = n => n in col;
    // 导入检查
    const known = new Set([...NEED, ...OPTIONAL.map(o => o[0]), ...DIMS, ...Object.values(groups).flat().map(x => x.name)]);
    const check = { rows: data.length, found: OPTIONAL.filter(o => has(o[0])).map(o => o[1]), missing: OPTIONAL.filter(o => !has(o[0])).map(o => o[1]),
      ignored: hdr.filter(h => h && !known.has(h) && !/^\d+(\.\d+)?-/.test(h)).length, balance: null };
    const parts = ['-产品成本', '-AP', '-TP', '-CP', '-PP', '-MP', '-FP', '-产品组/研发费用合计', '-AE', '所得税'];
    if (parts.every(has)) {
      let rev = 0, gap = 0;
      for (const r of data) { const v = n => +r[col[n]] || 0; rev += Math.abs(v('收入')); gap += Math.abs(v('收入') - parts.reduce((a, n) => a + v(n), 0) - v('=产品考核净利润')); }
      check.balance = { ok: gap <= Math.max(0.01, rev * 0.001), gap };

  }
  function normMonth(v) {
    if (typeof v === 'number') { // Excel 日期序号
      if (v > 20000) { const d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCFullYear() + '/' + String(d.getUTCMonth() + 1).padStart(2, '0'); }

  }

  function values(ds, dim) { return dim in ds.col ? [...new Set(ds.data.map(r => r[ds.col[dim]]).filter(v => v != null && v !== ''))].sort((a, b) => String(a).localeCompare(String(b), 'zh')) : []; }

  /* ---------- 汇总 ---------- */
  function sums(ds, f) {
    const s = new Float64Array(ds.hdr.length), cats = new Map(), skus = new Map();
    const iM = ds.col['日历年/月'], iD = f.dim && f.dim in ds.col ? ds.col[f.dim] : -1, iC = ds.col['一级品类'] ?? -1, iS = ds.col['四级规格'] ?? -1, iG = ds.col['收入'], iP = ds.col['=产品考核净利润'];
    for (const r of ds.data) {
      if (!f.months.has(r[iM])) continue;
      if (iD >= 0 && f.cust !== '全部' && r[iD] !== f.cust) continue;

      const add = (m, k) => { const o = m.get(k) || { rev: 0, profit: 0 }; o.rev += +r[iG] || 0; o.profit += +r[iP] || 0; m.set(k, o); };
      if (iC >= 0) add(cats, r[iC] || '未分类'); if (iS >= 0) add(skus, r[iS] || '未知规格');

    return { s, cats, skus };
  }

  /* ---------- 一段（当月 / 累计）的分析 ---------- */
  function section(dc, dp, f, opts) {
    const A = sums(dc, { dim: f.dim, cust: f.cust, months: new Set(f.cur) }), B = sums(dp, { dim: f.dim, cust: f.cust, months: new Set(f.pri) });
    const g = (X, ds, n) => n in ds.col ? (X.s[ds.col[n]] || 0) : 0;
    const rev = { a: g(A, dc, '收入'), b: g(B, dp, '收入') }, profit = { a: g(A, dc, '=产品考核净利润'), b: g(B, dp, '=产品考核净利润') };
    rev.d = rev.a - rev.b; profit.d = profit.a - profit.b;
    const rate = (X, ds, n) => { const G = g(X, ds, '收入'); return G && n in ds.col ? g(X, ds, n) / G : null; };
    const feeRow = (label, n) => { const a = rate(A, dc, n), b = rate(B, dp, n); return { label, key: n, a, b, d: a !== null && b !== null ? a - b : null }; };
    const fees = [['毛利率', '=产品毛利额']].concat(FEES.map(n => [n.slice(1), n])).filter(([, n]) => n in dc.col && n in dp.col).map(([l, n]) => feeRow(l, n));
    const tp5n = dc.groups['-TP'].find(x => /供价差异/.test(x.name) && x.level === 1);
    const tp5 = tp5n ? feeRow('TP5', tp5n.name) : null;
    const subRate = (X, ds, name) => { const i = ds.hdr.indexOf(name); const G = g(X, ds, '收入'); return i >= 0 && G ? (X.s[i] || 0) / G : 0; };
    const subAmt = (X, ds, name) => { const i = ds.hdr.indexOf(name); return i >= 0 ? (X.s[i] || 0) : 0; };
    const cpBreak = dc.groups['-CP'].filter(x => x.level === 1).map(x => ({ name: clean(x.name), a: subRate(A, dc, x.name), b: subRate(B, dp, x.name) })).map(x => Object.assign(x, { d: x.a - x.b }));
    const drill = {};
    FEES.forEach(n => {
      drill[n] = dc.groups[n].filter(x => x.level === 2).map(x => ({ name: clean(x.name), a: subRate(A, dc, x.name), b: subRate(B, dp, x.name), amtA: subAmt(A, dc, x.name), amtB: subAmt(B, dp, x.name) }))
        .map(x => Object.assign(x, { d: x.a - x.b })).filter(x => Math.abs(x.d) > 1e-6).sort((p, q) => Math.abs(q.d) - Math.abs(p.d)).slice(0, 5);
    });
    const diffMap = (ma, mb) => { const out = []; new Set([...ma.keys(), ...mb.keys()]).forEach(k => { const a = ma.get(k) || { rev: 0, profit: 0 }, b = mb.get(k) || { rev: 0, profit: 0 }; out.push({ name: k, revA: a.rev, revB: b.rev, rev: a.rev - b.rev, profitA: a.profit, profitB: b.profit, profit: a.profit - b.profit }); }); return out; };
    const cats = diffMap(A.cats, B.cats), skus = diffMap(A.skus, B.skus);
    const sec = { rev, profit, fees, tp5, cpBreak, drill, cats, skus, months: f.cur, monthsPri: f.pri, empty: !rev.a && !rev.b,
      hasProduct: '一级品类' in dc.col && '一级品类' in dp.col, hasSku: '四级规格' in dc.col && '四级规格' in dp.col, missingPri: f.pri.filter(m => !dp.months.includes(m)) };
    sec.thr = Math.max(opts.minWan, Math.abs(rev.b) * 0.01, Math.abs(rev.a) * 0.01);
    sec.conclusions = conclude(sec, opts);
    return sec;
  }
  const clean = n => n.replace(/^\d+(\.\d+)?-/, '').trim();

  function analyze(dc, dp, f, opts) {
    opts = Object.assign({ minWan: 1, drillPP: 0.01, topSku: 5 }, opts || {});
    const cumMonths = dc.months.filter(m => m >= f.cumStart && m <= f.month);
    return {
      cust: f.cust, month: f.month, dim: f.dim,
      当月: section(dc, dp, { dim: f.dim, cust: f.cust, cur: [f.month], pri: [prevYear(f.month)] }, opts),
      累计: section(dc, dp, { dim: f.dim, cust: f.cust, cur: cumMonths, pri: cumMonths.map(prevYear) }, opts),
      opts
    };
  }

  /* ---------- 格式 ---------- */
  const wan = v => { const r = Math.round(v); return (r === 0 && v !== 0 ? (+v.toFixed(1)) : r).toLocaleString('zh-CN') + '万'; };
  const swan = v => (v > 0 ? '+' : '') + wan(v);
  const pc = v => v === null || v === undefined ? '—' : (v * 100).toFixed(1) + '%';
  const spc = v => v === null || v === undefined ? '—' : (v > 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
  const growth = (a, b) => b > 0 ? spc(a / b - 1).replace('%', '%') : null;
  function profitPhrase(p) {
    if (p.b > 0 && p.a >= 0) return '增长率' + growth(p.a, p.b);
    if (p.b < 0 && p.a < 0) return p.d >= 0 ? '减亏' + wan(p.d) : '亏损扩大' + wan(-p.d);

  }
  function productText(sec, opts) {
    if (!sec.hasProduct) return `收入（${swan(sec.rev.d)}），利润（${swan(sec.profit.d)}）\n（数据里没有“一级品类”列，品类分析不显示）`;
    const n = (opts && opts.topSku) || 5;
    const f = (xs, key) => xs.map(x => x.name + swan(x[key])).join('、') || '无';
    const up = lst(sec.cats, 'rev', 1, sec.thr), dn = lst(sec.cats, 'rev', -1, sec.thr), skUp = lst(sec.skus, 'rev', 1, sec.thr).slice(0, 3), skDn = lst(sec.skus, 'rev', -1, sec.thr).slice(0, n);
    const pup = lst(sec.cats, 'profit', 1, sec.thr), pdn = lst(sec.cats, 'profit', -1, sec.thr), pskDn = lst(sec.skus, 'profit', -1, sec.thr).slice(0, 3);
    return `收入（${swan(sec.rev.d)}）：\n增长品类：${f(up, 'rev')}` + (skUp.length ? `\n（${f(skUp, 'rev')}）` : '') +
      `\n下滑品类：${f(dn, 'rev')}` + (skDn.length ? `\n（${f(skDn, 'rev')}）` : '') +
      `\n\n利润（${swan(sec.profit.d)}）：\n增长品类：${f(pup, 'profit')}\n下滑品类：${f(pdn, 'profit')}` + (pskDn.length ? `\n（${f(pskDn, 'profit')}）` : '');
  }
  function feeText(sec) {
    if (!sec.fees.length) return '（数据里没有费用列，费用分析不显示）';
    let t = sec.fees.map(x => `${x.label}：本期${pc(x.a)}，同期${pc(x.b)}，差异${spc(x.d)}`).join('\n');

    if (sec.tp5) t += `\nTP5：本期${pc(sec.tp5.a)}，同期${pc(sec.tp5.b)}，差异${spc(sec.tp5.d)}`;
    const cp = sec.fees.find(x => x.key === '-CP'), parts = sec.cpBreak.filter(x => Math.abs(x.d) >= 0.0005).sort((p, q) => Math.abs(q.d) - Math.abs(p.d)).slice(0, 3);
    if (cp) t += `\nCP${spc(cp.d)}` + (parts.length ? '，其中' + parts.map(x => x.name + spc(x.d)).join('、') : '');

      const top = (sec.drill[x.key] || []).filter(s => Math.sign(s.d) === Math.sign(x.d)).slice(0, 2);
      if (top.length) t += `\n${x.label}${spc(x.d)}，主要来自` + top.map(s => s.name + spc(s.d)).join('、');
    });

  }

  /* ---------- 结论规则 ---------- */
  function conclude(sec, opts) {
    if (sec.empty) return ['本期和同期都没有数据。'];
    const out = [], rd = sec.rev.d, pd = sec.profit.d, r = sec.rev;
    const g = r.b > 0 ? r.a / r.b - 1 : null;
    if (rd < 0 && pd > 0) out.push(`收入减少${wan(-rd)}，利润反而改善${wan(pd)}，属于“量缩、利改善”的结构，减亏不是靠销量提升带来的`);
    else if (rd > 0 && pd < 0) out.push(`收入增加${wan(rd)}，利润却减少${wan(-pd)}，增收不增利`);
    else if (rd < 0 && pd < 0) out.push(`收入减少${wan(-rd)}，利润减少${wan(-pd)}，量利双降`);
    else if (rd > 0 && pd > 0) out.push(`收入增加${wan(rd)}，利润增加${wan(pd)}，量利双增`);
    const up = lst(sec.cats, 'rev', 1, sec.thr), skUp = lst(sec.skus, 'rev', 1, sec.thr);
    if (!up.length) out.push('没有收入增长的品类' + (skUp.length ? `，仅${skUp[0].name}增长${wan(skUp[0].rev)}` : ''));
    else if (skUp.length) out.push(`收入增量主要来自${skUp[0].name}（${swan(skUp[0].rev)}）`);
    const cannibal = sec.skus.filter(x => x.rev >= sec.thr && x.profit <= -Math.max(3, sec.thr)).sort((p, q) => p.profit - q.profit)[0];
    if (cannibal) out.push(`${cannibal.name}收入${swan(cannibal.rev)}但利润${swan(cannibal.profit)}，增收不增利，吃掉了其他品类的利润改善`);
    const pdn = lst(sec.cats, 'profit', -1, sec.thr);
    if (pdn.length && pd < 0) out.push(`利润主要被${pdn.slice(0, 2).map(x => x.name + swan(x.profit)).join('、')}拖累`);
    const gm = sec.fees.find(x => x.key === '=产品毛利额'), feeD = sec.fees.filter(x => x.key !== '=产品毛利额').reduce((s, x) => s + (x.d || 0), 0);
    if (gm && gm.d !== null && gm.d <= -0.01) {
      if (feeD < -0.005) out.push(Math.abs(gm.d) > Math.abs(feeD) ? `毛利率下滑${(Math.abs(gm.d) * 100).toFixed(1)}个百分点，超过费用率压降的${(Math.abs(feeD) * 100).toFixed(1)}个百分点，费用节约补不上毛利缺口` : `毛利率下滑${(Math.abs(gm.d) * 100).toFixed(1)}个百分点，但费用率压降${(Math.abs(feeD) * 100).toFixed(1)}个百分点，抵消了毛利缺口`);
      else if (feeD > 0.005) out.push(`毛利率下滑${(Math.abs(gm.d) * 100).toFixed(1)}个百分点，费用率又上升${(feeD * 100).toFixed(1)}个百分点，利润受双重挤压`);
      else out.push(`毛利率下滑${(Math.abs(gm.d) * 100).toFixed(1)}个百分点`);
    }
    const big = sec.fees.filter(x => x.key !== '=产品毛利额').filter(x => x.d !== null).sort((p, q) => Math.abs(q.d) - Math.abs(p.d))[0];
    if (big && Math.abs(big.d) >= 0.02) {
      const top = (sec.drill[big.key] || []).filter(s => Math.sign(s.d) === Math.sign(big.d))[0];
      out.push(`${big.label}费率${big.d > 0 ? '上升' : '下降'}${(Math.abs(big.d) * 100).toFixed(1)}个百分点` + (top ? `，主要来自${top.name}（${spc(top.d)}）` : ''));
    }
    const fixedUp = sec.fees.filter(x => ['-PP', '-MP'].includes(x.key) && x.d > 0.005);
    if (g !== null && g < -0.3 && fixedUp.length) out.push(`收入萎缩推高了${fixedUp.map(x => x.label).join('、')}等相对固定费用的费率`);
    return out;
  }

  /* ---------- 思维导图结构（导出 XMind / 复制文字共用） ---------- */
  function splitConclusions(s) {
    return { product: s.conclusions.filter(c => !/费率|毛利/.test(c)).join('；'), fee: s.conclusions.filter(c => /费率|毛利/.test(c)).join('；') || '费用结构变化不大' };
  }
  function tree(results, title, edits) {
    return { title, children: results.map(res => ({ title: res.cust, children: ['当月', '累计'].map(k => {
      const s = res[k], e = Object.assign(splitConclusions(s), ((edits || {})[res.cust] || {})[k] || {});
      return { title: k + '\n' + headline(s), bold: k, children: [
        { title: '产品维度\n' + productText(s, res.opts), children: [{ title: '结论：' + (e.product || '—') }] },
        { title: '费用维度\n' + feeText(s), children: [{ title: '结论：' + (e.fee || '—') }] }
      ] };
    }) })) };
  }
  function treeText(node, d = 0) { return '  '.repeat(d) + '- ' + node.title.replace(/\n/g, '\n' + '  '.repeat(d) + '  ') + '\n' + (node.children || []).map(c => treeText(c, d + 1)).join(''); }

  /* ---------- 由实际数据生成测算方案 ---------- */
  function toScheme(dc, f, price) {
    const X = sums(dc, { dim: f.dim, cust: f.cust, months: new Set(f.months), sku: f.sku });
    const g = n => X.s[dc.col[n]] || 0, G = g('收入');
    if (!(G > 0)) throw new Error('所选范围的收入为 0，无法生成方案');
    const need = ['-产品成本', '-AP', '-TP', '-CP', '-PP', '-MP', '-FP'].filter(n => !(n in dc.col));
    if (need.length) throw new Error('数据缺少这些费用列，无法生成完整方案：' + need.join('、'));
    const r = n => g(n) / G, other = (G - g('-产品成本') - g('-AP') - g('-TP') - g('-CP') - g('-PP') - g('-MP') - g('-FP') - g('=产品考核净利润')) / G;
    const vol = Math.round(G * 10000 / price);
    const p2 = v => Math.round(v * 10000) / 10000;
    const items = [['AP 广告费用', r('-AP')], ['CP 促销费用', r('-CP')], ['MP 管理费用', r('-MP')], ['FP 财务费用', r('-FP')], ['其他（研发/公摊/所得税）', other]]
      .map(([name, v], i) => ({ id: 'act' + i, name, nature: 'cost', method: 'pct', pctBase: 'eff', src: 'num', vals: { base: p2(v * 100), promo: p2(v * 100) } }));
    const base = { list: price, discount: 0, volume: vol, purchase: p2(price * r('-产品成本')), purchaseUnit: 'bag', bagsPerBox: 12, laborMode: 'none', labor: 0, cold: p2(price * r('-PP')), loss: 0, rate: p2(r('-TP') * 100), rateBase: 'eff', fee: 0 };
    return { expectProfit: g('=产品考核净利润') * 10000, revenue: G * 10000, base, items };
  }

  return { SOURCES, detect, splitConclusions, OPTIONAL, NEED, dataset, values, analyze, tree, treeText, headline, productText, feeText, toScheme, prevYear, wan, swan, pc, spc, DIMS };
})();
if (typeof module !== 'undefined') module.exports = Review;
</script>
<script>/* ===== 复盘结果导出：Excel（数据表）与 XMind（括号图，结构同手工思维导图） ===== */
const ReviewExport = (() => {
  const uuid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });

  function xmind(tree) {
    const topic = (n, root) => {
      const t = { id: uuid(), class: 'topic', title: n.title };
      if (root) t.structureClass = 'org.xmind.ui.brace.right';
      const nl = n.title.indexOf('\n');
      if (nl > 0) t.attributedTitle = [{ text: n.title.slice(0, nl), 'fo:font-weight': '700' }, { text: n.title.slice(nl) }];
      if (n.children && n.children.length) t.children = { attached: n.children.map(c => topic(c)) };
      return t;
    };
    const content = [{ id: uuid(), revisionId: uuid(), class: 'sheet', title: '损益复盘', rootTopic: topic(tree, true) }];
    return XLSX.zip([
      { name: 'content.json', data: JSON.stringify(content) },
      { name: 'metadata.json', data: JSON.stringify({ dataStructureVersion: '3', creator: { name: '三全利润与人工测算器', version: '2' }, layoutEngineVersion: '5' }) },
      { name: 'manifest.json', data: JSON.stringify({ 'file-entries': { 'content.json': {}, 'metadata.json': {} } }) }
    ]);
  }

  function excel(results, edits, meta) {
    const { Sheet, S, book } = XLSX, V = Review, sheets = [];
    const doc = new Sheet('说明'); doc.widths = [100];
    ['损益复盘（由导入数据自动生成）', '', '分析月份：' + meta.month + '　累计范围：' + meta.cumRange + '　客户列：' + meta.dim, '金额单位：万元；费率 = 费用 ÷ 收入；差异 = 本期费率 − 同期费率。',
      '这里是计算结果（数值），不是公式。原始数据请回到系统导出的明细核对。', '导出时间：' + new Date().toLocaleString('zh-CN')].forEach((t, i) => doc.set(0, i + 1, { v: t, s: i ? S.txt : S.title }));
    sheets.push(doc);
    const used = new Set(['说明']);
    results.forEach(res => {
      let nm = String(res.cust).replace(/[\[\]:*?\/\\']/g, '').slice(0, 28) || '客户'; let x = nm, k = 2; while (used.has(x)) x = nm + k++; used.add(x);
      const sh = new Sheet(x); sh.widths = [26, 14, 14, 14, 14, 3, 26, 14, 14, 14, 14]; let r = 1;
      sh.set(0, r++, { v: res.cust + ' 损益复盘（' + meta.month + '）', s: S.title }); r++;
      ['当月', '累计'].forEach(key => {
        const s = res[key];
        sh.set(0, r, { v: key + '（' + s.months[0] + (s.months.length > 1 ? ' ~ ' + s.months[s.months.length - 1] : '') + '）', s: S.sec }); for (let c = 1; c < 5; c++) sh.set(c, r, { v: '', s: S.sec }); r++;
        ['项目', '本期', '同期', '差额', '增长率'].forEach((h, c) => sh.set(c, r, { v: h, s: S.head })); r++;
        [['收入（万元）', s.rev], ['利润（万元）', s.profit]].forEach(([l, o]) => { sh.set(0, r, { v: l }); sh.set(1, r, { v: o.a, s: S.wan }); sh.set(2, r, { v: o.b, s: S.wan }); sh.set(3, r, { v: o.d, s: S.wan }); sh.set(4, r, o.b > 0 ? { v: o.a / o.b - 1, s: S.pct } : { v: '—' }); r++; });
        r++;
        if (s.fees.length) {
          ['费用率', '本期', '同期', '差异'].forEach((h, c) => sh.set(c, r, { v: h, s: S.head })); r++;
          s.fees.concat(s.tp5 ? [s.tp5] : []).forEach(f => { sh.set(0, r, { v: f.label }); sh.set(1, r, { v: f.a, s: S.pct }); sh.set(2, r, { v: f.b, s: S.pct }); sh.set(3, r, { v: f.d, s: S.pct }); r++; });
          s.cpBreak.forEach(f => { sh.set(0, r, { v: '  CP·' + f.name }); sh.set(1, r, { v: f.a, s: S.pct }); sh.set(2, r, { v: f.b, s: S.pct }); sh.set(3, r, { v: f.d, s: S.pct }); r++; });
          r++;
          ['费用子项（变化最大）', '本期费率', '同期费率', '差异', '本期金额'].forEach((h, c) => sh.set(c, r, { v: h, s: S.head })); r++;
          Object.entries(s.drill).forEach(([fk, list]) => list.slice(0, 3).forEach(d => { sh.set(0, r, { v: fk.slice(1) + '·' + d.name }); sh.set(1, r, { v: d.a, s: S.pct }); sh.set(2, r, { v: d.b, s: S.pct }); sh.set(3, r, { v: d.d, s: S.pct }); sh.set(4, r, { v: d.amtA, s: S.wan }); r++; }));
          r++;
        }
        if (s.hasProduct) {
          ['品类', '本期收入', '同期收入', '收入差额', '利润差额'].forEach((h, c) => sh.set(c, r, { v: h, s: S.head })); r++;
          s.cats.slice().sort((p, q) => p.rev - q.rev).forEach(c => { sh.set(0, r, { v: c.name }); sh.set(1, r, { v: c.revA, s: S.wan }); sh.set(2, r, { v: c.revB, s: S.wan }); sh.set(3, r, { v: c.rev, s: S.wan }); sh.set(4, r, { v: c.profit, s: S.wan }); r++; });
          r++;
        }
        if (s.hasSku) {
          ['规格（收入变化前 10）', '本期收入', '同期收入', '收入差额', '利润差额'].forEach((h, c) => sh.set(c, r, { v: h, s: S.head })); r++;
          s.skus.slice().sort((p, q) => Math.abs(q.rev) - Math.abs(p.rev)).slice(0, 10).forEach(c => { sh.set(0, r, { v: c.name }); sh.set(1, r, { v: c.revA, s: S.wan }); sh.set(2, r, { v: c.revB, s: S.wan }); sh.set(3, r, { v: c.rev, s: S.wan }); sh.set(4, r, { v: c.profit, s: S.wan }); r++; });
          r++;
        }
        sh.set(0, r, { v: '结论', s: S.head }); r++;
        const e = Object.assign(Review.splitConclusions(s), (edits[res.cust] || {})[key] || {});
        [['产品', e.product], ['费用', e.fee]].forEach(([l, t]) => { sh.set(0, r, { v: l + '：' + (t || ''), s: S.note }); r++; });
        r += 2;
      });
      sheets.push(sh);
    });
    return book(sheets);
  }
  return { xmind, excel };
})();
if (typeof module !== 'undefined') module.exports = ReviewExport;
</script>
<script>

const yuan2 = v => (v === null || v === undefined || !isFinite(v)) ? '—' : (v < 0 ? '-¥' : '¥') + Math.abs(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ======================= 利润测算：输入区 ======================= */
const ROWS = [
  { k: 'list', l: '标价', u: '元/袋', hint: '扣渠道费前的单袋售价' },

];
function renderChips(){

function renderInputs(){

    ['base', 'promo'].forEach(sk => {
      const s = k[sk];

function waterfall(r, color){

  if (r.costBag) steps.push({ n: '其他成本', v: -r.costBag * V });

  steps.push({ n: '活动等费用', v: -(r.fee + r.costEvt), tip: `活动费 ${yuan(r.fee)}` + (r.costEvt ? `<br>按活动计成本 ${yuan(r.costEvt)}` : '') });
  if (r.subEvt) steps.push({ n: '活动补贴', v: r.subEvt });

  let cum = 0; const bars = steps.map(s => { if (s.t){ const b = { ...s, y0: 0, y1: s.v }; cum = s.v; return b; } const b = { ...s, y0: cum, y1: cum + s.v }; cum += s.v; return b; });
  const W = 620, H = 270, L = 58, R = 10, T = 18, B = 34;
  const lo = Math.min(0, ...bars.map(b => Math.min(b.y0, b.y1))), hi = Math.max(0, ...bars.map(b => Math.max(b.y0, b.y1)));
  const y = v => T + (hi - v) / (hi - lo || 1) * (H - T - B), bw = (W - L - R) / bars.length;
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="利润瀑布图">`;
  niceTicks(lo, hi, 4).forEach(t => { g += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#eceae6"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#8a8984">${short(t)}</text>`; });
  g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="#9a9a94"/>`;
  bars.forEach((b, i) => {
    const x = L + i * bw + bw * 0.16, w = bw * 0.68, top = y(Math.max(b.y0, b.y1)), hgt = Math.max(1, Math.abs(y(b.y0) - y(b.y1)));
    const fill = b.t ? (b.v < 0 ? 'var(--neg)' : color) : (b.v >= 0 ? 'var(--up)' : 'var(--dec)');
    const tip = `<b>${b.n}</b> ${b.t ? '' : (b.v >= 0 ? '+' : '−')}${yuan(Math.abs(b.v)).replace('-', '')}` + (b.tip ? '<br>' + b.tip : '') + (!b.t && r.rev ? `<br>占收入 ${pct(Math.abs(b.v) / r.rev)}` : '');
    g += `<rect x="${x}" y="${top}" width="${w}" height="${hgt}" rx="3" fill="${fill}" data-tip="${esc(tip)}"/>`;
    if (i < bars.length - 1){ const ny = y(b.t ? b.y1 : b.y1); g += `<line x1="${x + w}" x2="${x + bw}" y1="${ny}" y2="${ny}" stroke="#b5b4ae" stroke-dasharray="2 2"/>`; }
    const lbl = b.t ? short(b.v) : (b.v >= 0 ? '+' : '−') + short(Math.abs(b.v));
    if (b.t || Math.abs(b.v) / (hi - lo || 1) > 0.025) g += `<text x="${x + w / 2}" y="${top - 4}" text-anchor="middle" font-size="11" fill="${b.t ? '#1b1b1a' : '#52514e'}" font-weight="${b.t ? 700 : 400}">${lbl}</text>`;
    g += `<text x="${x + w / 2}" y="${H - B + 16}" text-anchor="middle" font-size="11.5" fill="#52514e">${b.n}</text>`;
  });
  return g + '</svg>';
}
function compareBars(rows){ // rows: [{n, v, c}]

const REV = { cur: null, pri: null, file: '', dim: '', custs: [], month: '', cumStart: '', edits: {}, gen: {}, busy: false };
async function loadReviewFile(file){
  REV.busy = true; renderReview();
  try{
    const wb = await XLSXRead.open(await file.arrayBuffer());
    const hit = Review.detect(wb.sheetNames);
    if (!hit) throw new Error('认不出这是哪种数据。目前支持：' + Review.SOURCES.map(x => x.name + '（需要表：' + x.sheets.join('、') + '）').join('；') + '。\n这个文件里的表：' + wb.sheetNames.join('、'));
    const [cn, pn] = hit.sheets;
    const cur = Review.dataset(await wb.read(cn), '本期'), pri = Review.dataset(await wb.read(pn), '同期');
    Object.assign(REV, { cur, pri, file: file.name, source: hit.src, edits: {}, gen: {} });
    REV.dim = cur.dims.includes('四级渠道') ? '四级渠道' : cur.dims[0];
    REV.month = cur.months[cur.months.length - 1];
    REV.cumStart = cur.months.find(m => m.slice(0, 4) === REV.month.slice(0, 4)) || cur.months[0];
    REV.custs = topCusts(3);
    toast('已读取：' + file.name);
  }catch(err){ alert('导入失败：' + err.message); }
  REV.busy = false; renderReview();
}
function topCusts(n){
  const d = REV.cur, iD = d.col[REV.dim], iG = d.col['收入'], iM = d.col['日历年/月'], m = new Map();
  d.data.forEach(r => { if (r[iM] === REV.month) m.set(r[iD], (m.get(r[iD]) || 0) + (+r[iG] || 0)); });
  return [...m.entries()].filter(x => x[1] > 0 && x[0] != null).sort((a, b) => b[1] - a[1]).slice(0, n).map(x => x[0]);
}
function divBars(list, key, title){
  const xs = list.filter(x => Math.abs(x[key]) >= 0.05).sort((a, b) => b[key] - a[key]);
  if (!xs.length) return `<div class="hint">${title}：无变化</div>`;
  const W = 330, rowH = 20, L = 70, R = 10, H = 22 + xs.length * rowH, m = Math.max(...xs.map(x => Math.abs(x[key]))), mid = L + (W - L - R) / 2, sc = v => v / m * (W - L - R) / 2 * 0.68;
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title}"><text x="0" y="12" font-size="11.5" font-weight="700" fill="#1b1b1a">${title}（万元）</text>`;
  xs.forEach((x, i) => { const v = x[key], y = 20 + i * rowH, w = Math.abs(sc(v));
    g += `<text x="${L - 6}" y="${y + 12}" text-anchor="end" font-size="11" fill="#52514e">${esc(String(x.name).slice(0, 6))}</text>`;
    g += `<rect x="${v >= 0 ? mid : mid - w}" y="${y + 3}" width="${Math.max(1, w)}" height="12" rx="3" fill="${v >= 0 ? 'var(--base)' : 'var(--promo)'}" data-tip="<b>${esc(x.name)}</b><br>${key === 'rev' ? '收入' : '利润'} 本期 ${Review.wan(x[key + 'A'])} · 同期 ${Review.wan(x[key + 'B'])}<br>变化 ${Review.swan(v)}"/>`;
    g += `<text x="${v >= 0 ? mid + w + 4 : mid - w - 4}" y="${y + 12}" text-anchor="${v >= 0 ? 'start' : 'end'}" font-size="10.5" fill="#1b1b1a">${Review.swan(v).replace('万', '')}</text>`; });
  return g + `<line x1="${mid}" x2="${mid}" y1="18" y2="${H}" stroke="#9a9a94"/></svg>`;
}

  const d = $('#rv-drop'), f = $('#rv-file');
  d.onclick = () => f.click(); f.onchange = e => e.target.files[0] && loadReviewFile(e.target.files[0]);
  d.ondragover = e => { e.preventDefault(); d.classList.add('over'); }; d.ondragleave = () => d.classList.remove('over');
  d.ondrop = e => { e.preventDefault(); d.classList.remove('over'); const fl = e.dataTransfer.files[0]; if (fl) loadReviewFile(fl); };
}
function genScheme(cust){
  const g = REV.gen[cust] || {}, res = Review.analyze(REV.cur, REV.pri, { dim: REV.dim, cust, month: REV.month, cumStart: REV.cumStart });
  const sku = g.sku || (res.当月.skus.filter(x => x.revA > 0).sort((a, b) => b.revA - a.revA)[0] || {}).name, price = +g.price;
  if (!sku) return alert('当月没有可用的规格');
  if (!(price > 0)) return alert('请填写单袋到手价（元/袋），用来把金额折算成袋数和每袋成本');
  const months = g.range === 'c' ? REV.cur.months.filter(m => m >= REV.cumStart && m <= REV.month) : [REV.month];
  try{
    const sc = Review.toScheme(REV.cur, { dim: REV.dim, cust, sku, months }, price);
    const label = g.range === 'c' ? REV.cumStart + '~' + REV.month : REV.month;
    S.skus.push({ id: uid(), name: `${cust}·${sku}（${label}实际）`, base: scheme(sc.base), promo: scheme(JSON.parse(JSON.stringify(sc.base))), items: sc.items, metrics: [], laborAlloc: 10,
      assumed: { purchase: false, labor: false, cold: false, loss: false }, source: { file: REV.file, cust, sku, label, price, profit: sc.expectProfit } });
    S.active = S.skus.length - 1; S.view = 'base'; save();
    document.querySelector('nav.tabs button[data-tab=profit]').click();
    toast(`已生成：基准方案 = ${label} 实际数据（利润 ${yuan(sc.expectProfit)}），在促销列试算`);
  }catch(err){ alert(err.message); }
}

/* ======================= 渲染 ======================= */
function renderAll(full){
  const tab = document.querySelector('nav.tabs button.on').dataset.tab;
  if (tab === 'profit'){ renderChips(); renderInputs(); renderResults(); }
  if (tab === 'review') renderReview();
  if (tab === 'labor'){ renderLaborIn(); renderLaborOut(); }
  if (tab === 'sum') renderSum();
  if (tab === 'set') renderSet();
}
renderAll(true);
</script>
